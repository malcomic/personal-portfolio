name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    needs: checks
    # Pull requests from forks don't get secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every run shares the Neon e2e branch, so never run two at once.
    concurrency:
      group: e2e-database
      cancel-in-progress: false
    env:
      CI: true
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}
      E2E_IP_HASH_SALT: ${{ secrets.E2E_IP_HASH_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets
        run: |
          for name in E2E_DATABASE_URL E2E_DIRECT_URL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name (see docs/testing.md)"; exit 1; fi
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
